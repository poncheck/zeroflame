{% extends "base.html" %}
{% block title %}Zmiana hasła — Zeroflame{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('index') }}">« wróć do dashboardu</a>

<div class="card manual-form" style="max-width:420px;">
  <h2 style="margin-top:0;">Zmień swoje hasło</h2>
  {% if success %}<div class="pill ok" style="display:block; padding:8px 10px; margin-bottom:12px;">{{ success }}</div>{% endif %}
  {% if error %}<div style="background:#f6e4e4; color:#8a3b3b; padding:8px 10px; border-radius:6px; font-size:13px; margin-bottom:12px;">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Aktualne hasło
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>Nowe hasło (min. 8 znaków)
      <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Powtórz nowe hasło
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </label>
    <div style="margin-top:14px;"><button type="submit">Zmień hasło</button></div>
  </form>
</div>
{% endblock %}
